:root{--ind:#2E2A7A;--vio:#6C4CF1;--teal:#0FA3B1;--org:#F28C1E;--navy:#1F2350;--bg:#F4F2FF;--ok:#16A34A;--bad:#E11D48;--fs:1;--cell:56px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:clip}
body{font-family:'Lexend','Baloo 2','Noto Sans Devanagari','Nirmala UI','Mangal',system-ui,sans-serif;color:var(--navy);background:var(--bg);font-size:calc(17px*var(--fs));line-height:1.4}
html[lang=hi] body{font-family:'Baloo 2','Noto Sans Devanagari','Nirmala UI','Mangal','Lexend',system-ui,sans-serif;font-size:calc(18.5px*var(--fs))}
button,select,input{font-family:inherit;font-size:1em}
button{cursor:pointer;min-height:44px;min-width:44px;touch-action:manipulation}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));color:#fff;background:linear-gradient(90deg,#2E2A7A,#6C4CF1 55%,#18B6C8);box-shadow:0 2px 10px #0003}
.top img{width:42px;height:42px;border-radius:50%;background:#fff}
.top h1{font-size:1.02em;margin:0;flex:1;min-width:150px;line-height:1.2}
.top h1 small{display:block;font-weight:400;opacity:.9;font-size:.75em}
.tbtns{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:#fff;color:var(--ind);border:none;border-radius:999px;padding:6px 13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.pill.o{background:var(--org);color:#fff}
.pill.off{opacity:.55}
select.pill{appearance:auto;padding:6px 10px}
.stars{color:#F7A11A;letter-spacing:2px;white-space:nowrap}.stars .off{color:#d8d3f3}
main{max-width:1180px;margin:0 auto;padding:16px max(12px,env(safe-area-inset-left))}
.view{display:none}.view.on{display:block}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:center;background:#fff;border-radius:22px;padding:16px;box-shadow:0 4px 18px #2E2A7A14}
.hero img{width:100%;border-radius:16px;display:block}
.hero h2{margin:.2em 0;font-size:1.55em;color:var(--ind);line-height:1.2}
.bigq{background:linear-gradient(90deg,#F7A11A,#E9781E);border-radius:14px;padding:10px 14px;color:var(--navy);font-weight:600}
.bigq b{display:block;color:#fff;font-size:.72em;letter-spacing:.14em}
.prog{height:14px;background:#ECE7FF;border-radius:99px;overflow:hidden;margin:8px 0 2px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--vio));border-radius:99px;transition:width .5s}
.langrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.lbtn{border:2px solid var(--vio);background:#fff;color:var(--vio);border-radius:999px;padding:6px 16px;font-weight:700}
.lbtn.on{background:var(--vio);color:#fff}
.map{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{position:relative;background:#fff;border:3px solid transparent;border-radius:20px;padding:14px;text-align:left;box-shadow:0 4px 14px #2E2A7A12;transition:transform .15s,border-color .15s;min-height:170px;display:flex;flex-direction:column;gap:6px;color:inherit}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--vio);outline:none}
.num{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;font-size:1.1em;flex:none}
.card h3{margin:2px 0 0;font-size:1.02em;color:var(--ind);line-height:1.25}
.card p{margin:0;font-size:.8em;color:#55597a;flex:1}
.card .stars{font-size:1.25em}
.card.locked{filter:grayscale(.9);opacity:.65}
.card .lockb{background:var(--navy);color:#fff;border-radius:10px;font-size:.72em;padding:5px 8px;text-align:center}
.card.final{grid-column:span 2;background:linear-gradient(135deg,#FFF1DE,#FFE3EF)}
.path{font-size:.72em;color:var(--vio);font-weight:700;letter-spacing:.06em}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.shead h2{margin:0;flex:1;color:var(--ind);font-size:1.35em;display:flex;align-items:center;gap:8px;min-width:200px;line-height:1.2}
.back{background:#fff;border:2px solid #ddd;border-radius:999px;padding:6px 14px;font-weight:700;color:var(--ind)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:2px solid var(--vio);background:#fff;color:var(--vio);border-radius:999px;padding:7px 14px;font-weight:700}
.tab.on{background:var(--vio);color:#fff}
.panel{background:#fff;border-radius:20px;padding:16px;box-shadow:0 4px 18px #2E2A7A14;position:relative}
.intro{display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:center;margin-bottom:12px}
.intro img{width:100%;border-radius:14px;display:block}
.say{display:flex;gap:10px;align-items:center;background:#E2F3FF;border-radius:16px;padding:10px 14px}
.say img{width:54px;height:54px;border-radius:50%;background:#fff;flex:none}
.qbox{font-size:1.15em;font-weight:600;margin:6px 0 12px;display:flex;gap:8px;align-items:flex-start}
.qbox span{flex:1}
.spk{border:none;background:#E2F3FF;border-radius:12px;padding:4px 10px;font-weight:700;color:var(--ind);flex:none}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt{background:#F6F4FF;border:3px solid #DCD5FF;border-radius:16px;padding:12px 14px;font-weight:600;text-align:left;transition:.15s;color:inherit;min-height:56px}
.opt:hover{border-color:var(--vio)}
.opt.ok{background:#DCFCE7;border-color:var(--ok)}.opt.no{background:#FFE4E6;border-color:var(--bad)}
.items{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.item{min-width:112px;max-width:240px;background:#fff;border:3px solid #DCD5FF;border-radius:16px;padding:8px 12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;color:inherit;line-height:1.25}
.item .e{font-size:2em;line-height:1}
.item.sel{border-color:var(--org);box-shadow:0 0 0 4px #F28C1E40;transform:scale(1.04)}
.item.done{display:none}
.bins{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.bin{border:3px dashed var(--teal);border-radius:18px;padding:10px;min-height:96px;background:#F0FDFA;text-align:center;font-weight:800;color:var(--teal)}
.bin.b2{border-color:var(--org);background:#FFF7ED;color:#C2410C}
.bin .got{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:6px;font-weight:600;color:var(--navy)}
.bin .got span{background:#fff;border-radius:10px;padding:2px 7px;font-size:.8em;border:1px solid #ddd}
.fb{min-height:1.6em;margin:10px 0;font-weight:700}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.go{background:var(--vio);color:#fff;border:none;border-radius:14px;padding:10px 18px;font-weight:800}
.go.o{background:var(--org)}.go.t{background:var(--teal)}.go.g{background:#8b91a7}
.score{margin-left:auto;font-weight:800;color:var(--vio)}
.gridwrap{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(5,var(--cell));grid-template-rows:repeat(5,var(--cell));gap:4px;background:#DCD5FF;padding:4px;border-radius:12px;width:max-content}
.cell{background:#fff;border-radius:8px;display:grid;place-items:center;font-size:calc(var(--cell)*.5)}
.cell.wall{background:#FFE9DC}.cell.trail{background:#CCFBF1}
.code{display:flex;flex-wrap:wrap;gap:4px;min-height:44px;background:#F6F4FF;border-radius:12px;padding:6px;margin:8px 0;align-items:center}
.code span{background:var(--vio);color:#fff;border-radius:8px;padding:2px 9px;font-weight:800}
.arrows{display:flex;gap:6px;flex-wrap:wrap}
.arrows button{font-size:1.4em;width:58px;height:52px;border-radius:12px;border:none;background:var(--teal);color:#fff}
.done-box{text-align:center;padding:14px}
.done-box .stars{font-size:3em}.done-box img{width:100px}
.ipo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.slot{border:3px dashed #c9c2ff;border-radius:14px;min-height:64px;padding:8px;text-align:center;font-weight:700}
.slot b{display:block;font-size:.75em;letter-spacing:.1em;color:var(--vio)}
.slot.f{border-style:solid;background:#F5F3FF}
/* timer + teams */
.tbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#FFF7ED;border:2px solid #FBD38D;border-radius:14px;padding:6px 10px;margin-bottom:10px}
.tbar .clock{font-weight:800;font-size:1.25em;color:#C2410C;min-width:84px}
.tbar .tprog{flex:1;min-width:100px;height:10px;background:#FDE7C8;border-radius:99px;overflow:hidden}
.tbar .tprog i{display:block;height:100%;background:linear-gradient(90deg,#F7A11A,#E11D48);transition:width .25s linear}
.tbar.low{animation:pulse .6s infinite alternate}
@keyframes pulse{to{background:#FFE4E6}}
.tbar button{background:#fff;border:2px solid #FBD38D;border-radius:12px;padding:4px 12px;font-weight:700;color:#9A3412}
.pausecover{position:absolute;inset:0;background:#ffffffd9;border-radius:20px;display:none;place-items:center;font-size:1.6em;font-weight:800;color:var(--vio);z-index:5}
.panel.paused .pausecover{display:grid}
.teams{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.team{flex:1;min-width:120px;border-radius:14px;padding:6px 10px;color:#fff;font-weight:700;display:flex;justify-content:space-between;align-items:center;opacity:.6;border:3px solid transparent}
.team.cur{opacity:1;border-color:#1F2350;transform:scale(1.03)}
.team b{font-size:1.3em}
.win{font-size:1.5em;font-weight:800;color:var(--ind);margin:8px 0}
table.wt{margin:0 auto;border-collapse:collapse}table.wt td,table.wt th{padding:6px 12px;border-bottom:1px solid #eee}
/* teacher */
.tset{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.tset .panel h3{margin-top:0;color:var(--ind)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #eee;min-height:48px}
.sw input[type=checkbox]{width:26px;height:26px;accent-color:var(--vio)}
input[type=range]{width:140px;accent-color:var(--vio)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--vio);background:#fff;color:var(--vio);border-radius:10px;padding:4px 12px;font-weight:700}
.seg button.on{background:var(--vio);color:#fff}
.txt{padding:8px;border-radius:10px;border:2px solid #c9c2ff;min-height:44px;max-width:100%}
table.rep{width:100%;border-collapse:collapse;font-size:.85em}
table.rep th{background:var(--vio);color:#fff;padding:6px;text-align:left}
table.rep td{padding:6px;border-bottom:1px solid #eee;vertical-align:top}
.repwrap{overflow-x:auto}
.gate{max-width:440px;margin:24px auto;text-align:center}
.gate input{font-size:1.4em;width:120px;text-align:center;padding:6px;border-radius:10px;border:2px solid var(--vio)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(140px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;transition:.3s;z-index:50;max-width:92vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.foot{text-align:center;font-size:.75em;color:#7a7da0;padding:16px}
@media (max-width:860px){.hero,.intro{grid-template-columns:1fr}.intro img{max-height:170px;object-fit:contain;background:#eef}}
@media (max-width:600px){
 body{font-size:calc(16px*var(--fs))} html[lang=hi] body{font-size:calc(17px*var(--fs))}
 .top h1 small{display:none}.top img{width:36px;height:36px}.pill{padding:6px 10px}
 .map{grid-template-columns:repeat(2,1fr);gap:10px}.card{min-height:150px;padding:10px}.card.final{grid-column:span 2}
 .opts{grid-template-columns:1fr}.ipo{grid-template-columns:1fr}
 .item{min-width:0;flex:1 1 40%;font-size:.88em}
 .bins{position:sticky;bottom:0;z-index:4;background:#fffffff0;padding:6px 0 4px}
 .bin{min-height:70px;font-size:.88em}.bin .got{display:none}
 :root{--cell:min(52px,calc((100vw - 60px)/5))}
 .hero h2{font-size:1.3em}
 .top{position:static;gap:6px;flex-wrap:nowrap}.top h1{font-size:.85em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top img{display:none}.tbtns{flex-wrap:nowrap}.lbl{display:none}.tbtns{gap:4px}
 .intro{grid-template-columns:1fr}.intro img{display:none}.say{padding:8px 10px;font-size:.9em}.say img{width:40px;height:40px}
 .tbar{gap:6px;padding:5px 8px;flex-wrap:nowrap}.tbar button{padding:4px 8px}.tbar .tprog{min-width:60px}.tbar .clock{min-width:0;font-size:1.1em}
 .tab{padding:5px 10px;font-size:.88em}
}
@media (min-width:1600px){body{font-size:calc(20px*var(--fs))}html[lang=hi] body{font-size:calc(21px*var(--fs))}main{max-width:1500px}:root{--cell:72px}.map{grid-template-columns:repeat(4,1fr)}}
@media (max-height:500px) and (orientation:landscape){.top{position:static}.intro{display:none}.bins{position:static}}
@media print{.top,.foot,.back{display:none}}

const MEL=[72,76,79,76,74,76,72,69, 67,69,72,74,76,74,72,0, 72,76,79,81,79,76,74,76, 72,74,76,74,72,69,72,0];

function go(v,arg){TM.stop();TM.total=0;if('speechSynthesis' in window)speechSynthesis.cancel();document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));
 if(v==='home')renderHome();else if(v==='sec')openSection(arg);else renderTeacher();
 document.getElementById('v-'+(v==='sec'?'sec':v)).classList.add('on');window.scrollTo({top:0});updTop()}
const secStars=id=>S.stars[id]||0;
const totalStars=()=>META.reduce((a,s)=>a+secStars(s.id),0)+secStars('fin');
const finalUnlocked=()=>S.settings.unlockAll||META.filter(s=>secStars(s.id)>0).length>=4;
function setLang(l){S.settings.lang=l;save();document.documentElement.lang=l;const v=document.querySelector('.view.on').id;
 if(v==='v-home')renderHome();else if(v==='v-teacher')renderTeacher();else openSection(cur.id||'fin',curGame);updTop()}
function cycleLang(){const ks=Object.keys(LANGS);setLang(ks[(ks.indexOf(L())+1)%ks.length])}
function updTop(){document.documentElement.lang=L();document.title=t('appTitle');document.getElementById('ttl').innerHTML=t('appTitle')+'<small>'+t('appSub')+'</small>';
 document.getElementById('totStars').textContent='★ '+totalStars()+' / 24';document.getElementById('bHome').innerHTML='🏠<span class="lbl"> '+t('home')+'</span>';document.getElementById('bTeach').innerHTML='🔧<span class="lbl"> '+t('teacher')+'</span>';
 document.getElementById('bLang').innerHTML='🌐<span class="lbl"> '+LANGS[L()].name+'</span>';const m=document.getElementById('bMusic');m.classList.toggle('off',!S.settings.music);
 document.getElementById('foot').textContent=t('foot')}
const langButtons=()=>`<div class="langrow"><b>🌐 ${t('language')}:</b>${Object.entries(LANGS).map(([k,v])=>`<button class="lbtn ${k===L()?'on':''}" onclick="setLang('${k}')">${v.name}</button>`).join('')}</div>`;
/* ---------- home ---------- */
function renderHome(){const tot=totalStars();
 document.getElementById('v-home').innerHTML=`<div class="hero"><div>
  <span class="path">${t('chapterTag')}</span><h2>${S.name?t('hi',{n:esc(S.name)})+' ':''}${t('worldsTitle')}</h2>
  ${langButtons()}
  <div class="bigq"><b>${t('bigQLabel')}</b>${t('bigQ')}</div>
  <p style="margin:.6em 0 .2em">${t('homeHelp')}</p>
  <div class="prog"><i style="width:${tot/24*100}%"></i></div><small>${t('starsCollected',{a:tot,b:24})}</small>
  ${S.name?'':`<div class="row" style="margin-top:10px"><input id="nm" class="txt" placeholder="${t('typeName')}"><button class="go t" onclick="S.name=document.getElementById('nm').value.trim().slice(0,20);save();go('home')">${t('start')}</button></div>`}
 </div><img src="${src('hero')}" alt=""></div>
 <div class="map">${META.map(m=>{const c=C(m.id);return `<button class="card" onclick="go('sec','${m.id}')"><span class="num" style="background:${m.col}">${m.n}</span><h3>${c.title}</h3><p>${c.blurb}</p>${starsHTML(secStars(m.id))}<span class="path">${t('games',{n:m.games.length})}</span></button>`}).join('')}
  <button class="card final ${finalUnlocked()?'':'locked'}" onclick="${finalUnlocked()?"go('sec','fin')":"toast(t('lockedMsg'));SND.no()"}">
   <span class="num" style="background:#F28C1E">🏆</span><h3>${t('finalTitle')}</h3><p>${t('finalBlurb')}</p>${starsHTML(secStars('fin'))}${finalUnlocked()?`<span class="path">${t('boss')}</span>`:`<span class="lockb">${t('lockBadge')}</span>`}</button></div>`}
/* ---------- section ---------- */
const allMcq=()=>META.flatMap(m=>C(m.id).games.filter((g,i)=>m.games[i].type==='mcq').flatMap(g=>g.qs));
function openSection(id,gi=0){TM.stop();TM.total=0;TURN=0;GPTS=[0,0,0,0];curGame=gi;const el=document.getElementById('v-sec');
 const head=(title,stars,col,n)=>`<div class="shead"><button class="back" onclick="go('home')">${t('back')}</button><h2>${n!=null?`<span class="num" style="background:${col}">${n}</span>`:''}${title}</h2>${starsHTML(stars)}</div>`;
 const box=`<div class="panel" id="game"><div class="pausecover">⏸ ${t('paused')}</div>${tbarHTML()}${teamsHTML()}<div id="gbody"></div></div>`;
 if(id==='fin'){cur={id:'fin'};el.innerHTML=head('🏆 '+t('finalTitle'),secStars('fin'))+box;startGame('mcq',shuf(allMcq()).slice(0,S.settings.qcount),'fin');return}
 const m=META.find(x=>x.id===id),c=C(id);cur=m;
 el.innerHTML=head(c.title,secStars(id),m.col,m.n)+`<div class="intro"><img src="${src(m.img)}" alt=""><div class="say"><img src="${src('chip')}" alt=""><div><b>${t('chipSays')}</b> ${c.say}</div></div></div>
  <div class="tabs">${m.games.map((g,i)=>`<button class="tab ${i===gi?'on':''}" onclick="openSection('${id}',${i})">${t('game',{n:i+1})}: ${c.games[i].t} ${S.best[id+'_'+i]!=null?starsHTML(pctStars(S.best[id+'_'+i])):''}</button>`).join('')}</div>`+box;
 const g=m.games[gi],gc=c.games[gi];const key=id+'_'+gi;
 if(g.type==='sort')startGame('sort',{bins:gc.bins,items:g.items.map((it,k)=>[gc.items[k],it[0],it[1]])},key);
 else if(g.type==='mcq')startGame('mcq',shuf(gc.qs),key);
 else if(g.type==='ipo')startGame('ipo',shuf(gc.ipo),key);
 else startGame('grid',null,key)}
let GS=null;
function startGame(type,data,key){GS={key,score:0,max:1,over:false};if(S.settings.timerMode==='game')TM.start(S.settings.timerSec*(type==='mcq'?Math.min(data.length,5):type==='sort'?Math.ceil(data.items.length/2):type==='ipo'?5:3),()=>{if(!GS.over)finish(GS.key,GS.score,GS.max)});
 ({sort:runSort,mcq:runMcq,ipo:runIpo,grid:runGrid})[type](data,key)}
function finish(key,score,max){if(GS.over)return;GS.over=true;TM.stop();TM.total=0;TM.draw();const p=score/max,st=pctStars(p);S.attempts[key]=(S.attempts[key]||0)+1;S.best[key]=Math.max(S.best[key]||0,p);
 if(key==='fin')S.stars.fin=Math.max(S.stars.fin||0,st);else{const sid=key.split('_')[0];const m=META.find(x=>x.id===sid);const avg=m.games.reduce((a,_,i)=>a+(S.best[sid+'_'+i]||0),0)/m.games.length;S.stars[sid]=Math.max(S.stars[sid]||0,pctStars(avg))}
 save();updTop();st>0?SND.star():SND.no();
 const next=key!=='fin'&&curGame<cur.games.length-1;let teamHTML='';
 if(teamsOn()){const n=S.settings.teams,mx=Math.max(...GPTS.slice(0,n)),w=GPTS.slice(0,n).map((v,i)=>v===mx?i:-1).filter(i=>i>=0);
  teamHTML=`<div class="win">${w.length>1?t('tie'):t('winner',{t:esc(teamName(w[0]))})}</div><table class="wt"><tr><th></th><th>${t('thisGame')}</th><th>${t('total')}</th></tr>${[...Array(n)].map((_,i)=>`<tr><td style="color:${TEAMCOL[i]};font-weight:800">${esc(teamName(i))}</td><td>${GPTS[i]}</td><td>${S.teamTotals[i]||0}</td></tr>`).join('')}</table>`}
 document.getElementById('gbody').innerHTML=`<div class="done-box"><img src="${src('chip')}" alt=""><h2>${t(['r0','r1','r2','r3'][st])}</h2>${starsHTML(st)}<p>${t('youScored',{a:score,b:max})}</p>${teamHTML}
  <div class="row" style="justify-content:center"><button class="go g" onclick="openSection('${cur.id}',${curGame})">${t('again')}</button>${next?`<button class="go" onclick="openSection('${cur.id}',${curGame+1})">${t('next')}</button>`:''}<button class="go o" onclick="go('home')">${t('toMap')}</button></div></div>`;
 document.querySelectorAll('#v-sec .shead .stars').forEach(e=>e.outerHTML=starsHTML(secStars(cur.id)))}
const busy=()=>TM.paused||GS.over;
/* sort: tap a card, then a box */
function runSort(g,key){const items=shuf(g.items);let sel=null,done=0;GS.max=items.length;const el=document.getElementById('gbody');
 el.innerHTML=`<div class="qbox"><span>${t('sortHelp')}</span>${spkBtn(t('sortHelp'))}</div><div class="row" id="turn">${turnLabel()}</div><div class="items">${items.map((it,i)=>`<button class="item" data-i="${i}"><span class="e">${it[1]}</span>${esc(it[0])}</button>`).join('')}</div>
  <div class="bins">${g.bins.map((b,j)=>`<button class="bin ${j?'b2':''}" data-j="${j}">${esc(b)}<div class="got"></div></button>`).join('')}</div>
  <div class="row"><div class="fb" id="fb"></div><span class="score" id="sc">0 / ${items.length}</span></div>`;
 speak(t('sortHelp'));
 const place=(i,j,timeout)=>{const it=items[i],fb=document.getElementById('fb');const ok=!timeout&&it[2]===j;
  if(ok){GS.score++;SND.ok();fb.className='fb ok';fb.textContent=t('sortOk',{a:it[0],b:g.bins[j]})}else{if(!timeout)SND.no();fb.className='fb no';fb.textContent=(timeout?t('timeUp')+' ':'')+t('sortNo',{a:it[0],b:g.bins[it[2]]})}
  el.querySelectorAll('.bin')[it[2]].querySelector('.got').insertAdjacentHTML('beforeend',`<span>${it[1]} ${esc(it[0])}</span>`);
  el.querySelector(`.item[data-i="${i}"]`).classList.add('done');sel=null;done++;document.getElementById('sc').textContent=GS.score+' / '+items.length;award(ok);document.getElementById('turn').innerHTML=turnLabel();
  if(done===items.length)setTimeout(()=>finish(key,GS.score,items.length),900);else qTimer(onUp)};
 const onUp=()=>{const rest=[...el.querySelectorAll('.item:not(.done)')];if(!rest.length)return;place(sel??+rest[0].dataset.i,-1,true)};
 el.querySelectorAll('.item').forEach(b=>b.onclick=()=>{if(busy())return;el.querySelectorAll('.item').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.i});
 el.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{if(busy())return;if(sel==null){toast(t('firstTap'));return}place(sel,+b.dataset.j)});
 qTimer(onUp)}
/* multiple choice */
function runMcq(qs,key){let i=0;GS.max=qs.length;const el=document.getElementById('gbody');
 const show=()=>{if(GS.over)return;if(i>=qs.length){finish(key,GS.score,qs.length);return}const q=qs[i];const order=shuf(q.slice(1).map((x,k)=>[x,k]));let answered=false;
  el.innerHTML=`<div class="row"><b>${t('question',{a:i+1,b:qs.length})}</b>${turnLabel()}<span class="score">${t('score',{n:GS.score})}</span></div>
   <div class="qbox"><span>${esc(q[0])}</span>${spkBtn(q[0])}</div><div class="opts">${order.map(([x,k])=>`<button class="opt" data-k="${k}">${esc(x)}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
  speak(q[0]);
  const pick=k=>{if(answered)return;answered=true;TM.onUp=null;if(S.settings.timerMode==='q')TM.stop();el.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.k===0)b.classList.add('ok')});const fb=document.getElementById('fb');
   if(k===0){GS.score++;SND.ok();fb.className='fb ok';fb.textContent=t('correct')}else{if(k!=null){SND.no();el.querySelector(`.opt[data-k="${k}"]`).classList.add('no')}fb.className='fb no';fb.textContent=(k==null?t('timeUp'):t('notQuite'))+' '+(S.settings.hints?t('answerIs',{a:q[1]}):'')}
   award(k===0);i++;setTimeout(show,1400)};
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(!busy())pick(+b.dataset.k)});qTimer(()=>pick(null))};
 show()}
/* IPO builder */
function runIpo(qs,key){let i=0;GS.max=qs.length;const el=document.getElementById('gbody');const N=t('ipoNames');
 const show=()=>{if(GS.over)return;if(i>=qs.length){finish(key,GS.score,qs.length);return}const q=qs[i];let parts=shuf([[0,q[1]],[1,q[2]],[2,q[3]]]),filled=[],ok=true,closed=false;
  const end=(good,msg)=>{closed=true;TM.onUp=null;if(S.settings.timerMode==='q')TM.stop();if(good)GS.score++;const fb=document.getElementById('fb');fb.className='fb '+(good?'ok':'no');fb.textContent=msg;award(good);i++;setTimeout(show,1400)};
  const draw=()=>{el.innerHTML=`<div class="row"><b>${t('round',{a:i+1,b:qs.length})}: ${esc(q[0])}</b>${turnLabel()}<span class="score">${t('score',{n:GS.score})}</span></div>
   <div class="qbox"><span>${t('ipoHelp')}</span>${spkBtn(q[0]+'. '+t('ipoHelp'))}</div>
   <div class="ipo">${N.map((x,k)=>`<div class="slot ${filled[k]?'f':''}"><b>${x}</b>${filled[k]?esc(filled[k][1]):''}</div>`).join('')}</div>
   <div class="items">${parts.map((p,k)=>`<button class="item" data-k="${k}">${esc(p[1])}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
   el.querySelectorAll('.item').forEach(b=>b.onclick=()=>{if(busy()||closed)return;const p=parts[+b.dataset.k];const need=filled.length;
    if(p[0]===need){SND.ok();filled.push(p);parts=parts.filter(x=>x!==p);draw();if(filled.length===3)end(ok,ok?t('ipoPerfect'):t('ipoDone'))}
    else{SND.no();ok=false;const fb=document.getElementById('fb');fb.className='fb no';fb.textContent=t('ipoWrong',{a:N[need]})}})};
  draw();speak(q[0]);qTimer(()=>{if(!closed){filled=[[0,q[1]],[1,q[2]],[2,q[3]]];parts=[];draw();end(false,t('timeUp'))}})};
 show()}
/* grid coding */
const LEVELS=[{walls:[[3,1],[1,2],[3,3],[2,4]],start:[0,4],goal:[4,0]},{walls:[[1,0],[1,1],[1,2],[3,2],[3,3],[3,4]],start:[0,0],goal:[4,4]},{walls:[[2,0],[2,1],[0,3],[1,3],[3,3],[4,1]],start:[0,4],goal:[4,0]}];
function runGrid(_,key){let lv=0,prog=[],tries=0,running=false;GS.max=LEVELS.length;const el=document.getElementById('gbody');const D={'↑':[0,-1],'↓':[0,1],'←':[-1,0],'→':[1,0]};
 const draw=(pos,trail=[],msg)=>{const Lv=LEVELS[lv];let cells='';for(let y=0;y<5;y++)for(let x=0;x<5;x++){const w=Lv.walls.some(a=>a[0]===x&&a[1]===y),tr=trail.some(a=>a[0]===x&&a[1]===y);
   cells+=`<div class="cell ${w?'wall':''} ${tr?'trail':''}">${pos[0]===x&&pos[1]===y?'🤖':(Lv.goal[0]===x&&Lv.goal[1]===y?'🖨️':(w?'🗄️':''))}</div>`}
  el.innerHTML=`<div class="row"><b>${t('level',{a:lv+1,b:LEVELS.length})}</b>${turnLabel()}<span class="score">${t('solved',{n:GS.score})}</span></div>
   <div class="qbox"><span>${t('gridHelp')}</span>${spkBtn(t('gridHelp'))}</div>
   <div class="gridwrap"><div class="grid">${cells}</div><div style="flex:1;min-width:230px"><div class="arrows">${Object.keys(D).map(a=>`<button data-a="${a}" aria-label="${a}">${a}</button>`).join('')}</div>
   <div class="code">${prog.length?prog.map(a=>`<span>${a}</span>`).join(''):`<i style="color:#888">${t('progHere')}</i>`}</div>
   <div class="row"><button class="go t" id="run">${t('run')}</button><button class="go g" id="undo">${t('undo')}</button><button class="go g" id="clr">${t('clear')}</button></div>
   <div class="fb ${msg?msg[0]:''}" id="fb">${msg?msg[1]:''}</div>${S.settings.hints&&tries>=2?`<small>${t('gridHint')}</small>`:''}</div></div>`;
  el.querySelectorAll('.arrows button').forEach(b=>b.onclick=()=>{if(busy()||running)return;if(prog.length<16){prog.push(b.dataset.a);draw(LEVELS[lv].start)}});
  el.querySelector('#undo').onclick=()=>{if(running)return;prog.pop();draw(LEVELS[lv].start)};el.querySelector('#clr').onclick=()=>{if(running)return;prog=[];draw(LEVELS[lv].start)};
  el.querySelector('#run').onclick=()=>{if(!busy()&&!running)run()}};
 const nextLevel=(ok)=>{award(ok);setTimeout(()=>{lv++;prog=[];tries=0;if(lv>=LEVELS.length)finish(key,GS.score,LEVELS.length);else{draw(LEVELS[lv].start);qTimer(onUp)}},1400)};
 const run=()=>{const Lv=LEVELS[lv];let p=Lv.start.slice(),trail=[p.slice()],k=0;tries++;running=true;
  const step=()=>{if(GS.over)return;if(TM.paused){setTimeout(step,300);return}
   if(k>=prog.length){running=false;if(p[0]===Lv.goal[0]&&p[1]===Lv.goal[1]){TM.onUp=null;if(S.settings.timerMode==='q')TM.stop();GS.score++;SND.ok();draw(p,trail,['ok',t('reached',{n:prog.length})]);nextLevel(true)}else{SND.no();draw(p,trail,['no',t('stopped')])}return}
   const d=D[prog[k++]],n=[p[0]+d[0],p[1]+d[1]];
   if(n[0]<0||n[0]>4||n[1]<0||n[1]>4||Lv.walls.some(a=>a[0]===n[0]&&a[1]===n[1])){running=false;SND.no();draw(p,trail,['no',t('bug',{n:k})]);return}
   p=n;trail.push(p.slice());SND.step(k);draw(p,trail);setTimeout(step,380)};step()};
 const onUp=()=>{running=false;draw(LEVELS[lv].start,[],['no',t('timeUp')]);nextLevel(false)};
 draw(LEVELS[0].start);speak(t('gridHelp'));qTimer(onUp)}
/* ---------- teacher area ---------- */
let gateOK=false;
function renderTeacher(){const el=document.getElementById('v-teacher');
 if(!gateOK){const a=6+Math.random()*4|0,b=6+Math.random()*4|0;el.innerHTML=`<div class="panel gate"><h2>${t('gateTitle')}</h2>${langButtons()}<p>${t('gateHelp')}</p><p style="font-size:1.6em;font-weight:800">${a} × ${b} = ?</p>
  <input id="ga" inputmode="numeric"> <button class="go" onclick="if(+document.getElementById('ga').value===${a*b}){gateOK=true;SND.open();renderTeacher()}else{SND.no();toast(t('tryAgain'))}">${t('enter')}</button>
  <p><button class="back" onclick="go('home')">${t('back')}</button></p></div>`;return}
 const st=S.settings,chk=(k,lab,after='')=>`<label class="sw">${lab}<input type="checkbox" ${st[k]?'checked':''} onchange="S.settings.${k}=this.checked;save();${after}"></label>`;
 const seg=(k,opts)=>`<div class="seg">${opts.map(([v,lab])=>`<button class="${st[k]==v?'on':''}" onclick="S.settings.${k}=${typeof v==='string'?`'${v}'`:v};save();renderTeacher()">${lab}</button>`).join('')}</div>`;
 const rows=META.map(m=>{const c=C(m.id);return `<tr><td>${m.n}. ${c.title}</td><td>${starsHTML(secStars(m.id))}</td><td>${m.games.map((g,i)=>c.games[i].t+': '+(S.best[m.id+'_'+i]!=null?Math.round(S.best[m.id+'_'+i]*100)+'%':'–')+' ('+(S.attempts[m.id+'_'+i]||0)+'×)').join('<br>')}</td></tr>`}).join('')+
  `<tr><td>🏆 ${t('finalTitle')}</td><td>${starsHTML(secStars('fin'))}</td><td>${S.best.fin!=null?Math.round(S.best.fin*100)+'%':'–'} (${S.attempts.fin||0}×)</td></tr>`;
 el.innerHTML=`<div class="shead"><button class="back" onclick="go('home')">${t('back')}</button><h2>${t('tTitle')}</h2></div>
 <div class="panel" style="margin-bottom:14px">${langButtons()}</div>
 <div class="tset">
  <div class="panel"><h3>⏱ ${t('tTimer')}</h3>
   <div class="sw" style="display:block"><div style="margin-bottom:6px">${t('timerMode')}</div>${seg('timerMode',[['off',t('tOff')],['q',t('tPerQ')],['game',t('tPerGame')]])}</div>
   <div class="sw" style="display:block"><div style="margin-bottom:6px">${t('seconds')}</div>${seg('timerSec',[[10,'10'],[20,'20'],[30,'30'],[60,'60']])}
    <div class="row" style="margin-top:6px">${t('custom')}: <input type="number" class="txt" min="5" max="600" value="${st.timerSec}" style="width:90px" onchange="S.settings.timerSec=Math.min(600,Math.max(5,+this.value||20));save();renderTeacher()"></div></div></div>
  <div class="panel"><h3>🎵 ${t('tSound')}</h3>
   ${chk('sound',t('sfx'),'applyVol()')}
   <label class="sw">${t('sfxVol')}<input type="range" min="0" max="1" step=".1" value="${st.vol}" onchange="S.settings.vol=+this.value;save();applyVol();SND.ok()"></label>
   ${chk('music',t('music'),'applyVol();this.checked?startMusic():stopMusic();updTop()')}
   <label class="sw">${t('musicVol')}<input type="range" min="0" max="1" step=".05" value="${st.mvol}" oninput="S.settings.mvol=+this.value;save();applyVol()"></label>
   ${chk('tts',t('tts'),"if(this.checked)speak(t('bigQ'))")}
   <label class="sw">${t('textSize')}<input type="range" min=".9" max="1.4" step=".1" value="${st.fs}" onchange="S.settings.fs=+this.value;save();document.documentElement.style.setProperty('--fs',this.value)"></label></div>
  <div class="panel"><h3>👥 ${t('tTeams')}</h3>
   <div class="sw" style="display:block"><div style="margin-bottom:6px">${t('teamsCount')}</div>${seg('teams',[[0,t('teamsOff')],[2,'2'],[3,'3'],[4,'4']])}</div>
   ${st.teams>=2?[...Array(st.teams)].map((_,i)=>`<label class="sw"><span style="color:${TEAMCOL[i]};font-weight:800">${t('teamName',{n:i+1})}</span><input class="txt" value="${esc(teamName(i))}" maxlength="18" onchange="S.settings.teamNames=S.settings.teamNames||[];S.settings.teamNames[${i}]=this.value.trim();save()"></label>`).join('')+
    `<div class="teams" style="margin-top:8px">${[...Array(st.teams)].map((_,i)=>`<div class="team cur" style="background:${TEAMCOL[i]}"><span>${esc(teamName(i))}</span><b>${S.teamTotals[i]||0}</b></div>`).join('')}</div>
    <button class="go g" onclick="S.teamTotals=[0,0,0,0];save();renderTeacher()">${t('resetTeams')}</button>`:''}</div>
